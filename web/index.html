<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d14"><meta name="description" content="TipOFF — NBA fixtures, UK odds and match insight.">
<link rel="manifest" href="/manifest.webmanifest"><title>TipOFF</title>
<style>
:root{color-scheme:dark;--bg:#090d14;--panel:#111a27;--panel2:#172333;--line:#29384b;--green:#31d894;--muted:#91a0b4;--white:#f4f7fb;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:90px}.top{position:sticky;top:0;z-index:5;background:#090d14ee;backdrop-filter:blur(18px);padding:20px 22px 14px;border-bottom:1px solid #182332;display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:900;letter-spacing:.18em;color:var(--green)}.profile{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.12em}.main{padding:22px 18px}.eyebrow{color:var(--green);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.heading{font-size:29px;font-weight:850;letter-spacing:-.04em;margin:7px 0}.sub{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 18px}.hero{padding:22px;border-radius:20px;background:radial-gradient(120% 140% at 100% 0%,#174a3b 0%,#142333 42%,#111a27 100%);border:1px solid #2a4b49;margin-bottom:18px}.hero .heading{font-size:34px;max-width:420px}.hero p{color:#b6c7d2;line-height:1.55}.section{display:flex;justify-content:space-between;align-items:center;margin:23px 2px 10px}.section h2{font-size:12px;letter-spacing:.13em;margin:0;color:#b5c3d2}.muted{color:var(--muted)}.card{background:linear-gradient(145deg,#172333,#101824);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.team{font-size:15px;font-weight:800}.score{font-size:19px;font-weight:900}.meta{font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:750}.btn{border:0;border-radius:12px;padding:14px 16px;background:var(--green);color:#06140f;font-size:12px;font-weight:900;letter-spacing:.06em;width:100%;margin:6px 0}.btn.secondary{background:#1b2b37;color:var(--green);border:1px solid #315044}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}.smallbtn{width:auto;padding:9px 12px;margin:0}.input{width:100%;background:#0d1520;border:1px solid #314156;border-radius:11px;color:white;padding:14px;margin:6px 0 10px;outline:none}.input:focus{border-color:var(--green)}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#111a27f5;border-top:1px solid #263346;display:flex;justify-content:center;padding:8px max(5px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}.tab{flex:1;max-width:120px;border:0;background:none;color:var(--muted);padding:5px 1px;font-size:10px;font-weight:700}.tab .ico{display:block;font-size:17px;margin-bottom:4px}.tab.active{color:var(--green)}.pill{border:1px solid var(--line);background:#101925;color:var(--muted);padding:8px 12px;border-radius:9px;font-size:11px}.pill.active{background:#153b30;color:var(--green);border-color:#2d765a}.price{font-size:23px;color:var(--green);font-weight:900}.book{font-size:12px;color:var(--muted);margin-top:3px}.divider{height:1px;background:var(--line);margin:10px 0}.story{font-weight:800;font-size:15px;line-height:1.35}.storydesc{font-size:13px;line-height:1.5;color:#aab8c8}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed #34445a;border-radius:15px;margin:12px 0}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#0e1722;border:1px solid var(--line);padding:12px;border-radius:12px}.stat strong{font-size:21px;display:block}.stat span{font-size:9px;color:var(--muted);letter-spacing:.1em}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#e8f6ef;color:#102018;padding:11px 16px;border-radius:30px;font-size:12px;font-weight:700;z-index:20;display:none}.hidden{display:none!important}
</style></head>
<body><div class="shell"><header class="top"><div class="brand">TIPOFF</div><div class="profile" id="profile">NBA INSIGHT</div></header><main class="main" id="view"></main></div>
<nav class="tabs" id="tabs"><button class="tab active" data-page="Home"><span class="ico">⌂</span>Home</button><button class="tab" data-page="Games"><span class="ico">◷</span>Games</button><button class="tab" data-page="Scanner"><span class="ico">◎</span>Odds</button><button class="tab" data-page="Acca"><span class="ico">▣</span>Slip</button><button class="tab" data-page="News"><span class="ico">▤</span>News</button><button class="tab" data-page="Settings"><span class="ico">⚙</span>Settings</button></nav><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state={page:"Home",games:[],events:[],news:[],legs:JSON.parse(localStorage.getItem("tipoff_legs")||"[]"),filter:"All",query:"",busy:false};
const key=k=>localStorage.getItem("tipoff_"+k)||"";
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2200)}
function card(t,b){return '<article class="card"><div class="eyebrow">'+t+'</div><div style="line-height:1.55;margin-top:8px;color:#c7d1df">'+b+'</div></article>'}
function btn(t,fn,cls=""){return '<button class="btn '+cls+'" data-action="'+fn+'">'+t+'</button>'}
function fmt(d){try{return new Date(d).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch{return d||"Time TBC"}}
function pageHead(k,t,s){return '<div class="eyebrow">'+k+'</div><h1 class="heading">'+t+'</h1><p class="sub">'+s+'</p>'}
function render(){
 $("#profile").textContent=(key("profile")||"NBA INSIGHT").toUpperCase();
 $("#tabs").querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));
 const v=$("#view");let h="";
 if(state.page==="Home"){
 h='<section class="hero"><div class="eyebrow">NBA • UK ODDS • MATCH INSIGHT</div><h1 class="heading">The game.<br>Beyond the numbers.</h1><p>Fixtures, recent team form and UK bookmaker prices in one courtside view.</p><div class="row"><button class="btn smallbtn" data-page="Games">GAME CENTRE</button><button class="btn secondary smallbtn" data-page="Scanner">COMPARE ODDS</button></div></section>';
 h+='<div class="section"><h2>TONIGHT ON THE COURT</h2><button class="pill" data-action="games">Refresh</button></div>';
 h+=state.games.length?state.games.slice(0,3).map(gameCard).join(""):'<div class="empty">Connect your BALLDONTLIE key in Settings to load NBA fixtures.</div>';
 h+='<div class="section"><h2>YOUR TIPOFF</h2></div>'+card("UK DECIMAL ODDS","Prices are shown in decimal format. The best displayed price is not automatically a value bet.")+card("MATCH INSIGHT","Recent results describe past performance. They are not guaranteed predictions.");
 }
 if(state.page==="Games"){
 h=pageHead("NBA / FIXTURES","Game centre","Live scores, upcoming fixtures and recent-form matchups.");
 h+='<div class="row"><input class="input" id="search" placeholder="Search team name" value="'+esc(state.query)+'"><button class="btn smallbtn" data-action="search">SEARCH</button></div><div class="row" style="flex-wrap:wrap;margin:7px 0 12px">'+["All","Upcoming","Live","Final"].map(x=>'<button class="pill '+(state.filter===x?"active":"")+'" data-filter="'+x+'">'+x+'</button>').join("")+'</div>';
 h+=state.games.length?state.games.filter(g=>{let a=(g.visitor_team?.full_name||"").toLowerCase(),b=(g.home_team?.full_name||"").toLowerCase(),q=state.query.toLowerCase(),st=status(g);return (!q||a.includes(q)||b.includes(q))&&(state.filter==="All"||(state.filter==="Final"&&st==="FINAL")||(state.filter==="Live"&&st.startsWith("LIVE"))||(state.filter==="Upcoming"&&st!=="FINAL"&&!st.startsWith("LIVE")))}).map(gameCard).join(""):'<div class="empty">No fixtures loaded. Add your BALLDONTLIE API key in Settings, then refresh.</div>';
 h+=btn("REFRESH NBA FIXTURES","games");
 }
 if(state.page==="Scanner"){
 h=pageHead("UK MARKETS / MONEYLINE","Odds scanner","Compare the best available decimal price from supported UK bookmakers.");
 h+=btn("REFRESH UK ODDS","odds");
 h+=state.events.length?state.events.map(oddsCard).join(""):'<div class="empty">No prices loaded. Connect an Odds API key with UK region access in Settings.</div>';
 h+=card("PRICE GUIDE","Best price means the highest price returned by the feed. Implied probability is a raw odds conversion, not a true forecast.");
 }
 if(state.page==="Acca"){
 const total=state.legs.reduce((a,x)=>a*Number(x.odds),1);
 h=pageHead("YOUR BET SLIP","Accumulator","Build a slip with decimal odds and estimate the potential return.");
 h+='<article class="hero"><div class="eyebrow">SLIP / '+state.legs.length+' SELECTIONS</div><div class="heading">'+(state.legs.length?total.toFixed(2):"—")+'</div><div class="meta">COMBINED DECIMAL ODDS</div></article>';
 h+=state.legs.length?state.legs.map((x,i)=>'<article class="card"><div class="row"><div><div class="team">'+esc(x.name)+'</div><div class="meta">SELECTION '+(i+1)+'</div></div><div class="price">'+Number(x.odds).toFixed(2)+'</div></div><button class="pill" data-remove="'+i+'">REMOVE</button></article>').join(""):'<div class="empty">Your slip is empty. Add a selection from the Odds scanner or enter one below.</div>';
 h+='<div class="section"><h2>ADD SELECTION</h2></div><input class="input" id="legname" placeholder="Selection name"><input class="input" id="legodds" type="number" step=".01" min="1.01" placeholder="Decimal odds (e.g. 1.80">'+btn("ADD TO SLIP","addleg");
 if(state.legs.length)h+='<div class="section"><h2>POTENTIAL RETURN</h2></div><input class="input" id="stake" type="number" min=".01" step=".01" value="10" placeholder="Stake in £"><div id="return" class="card">Enter a stake to estimate returns.</div>'+btn("CALCULATE RETURN","return");
 }
 if(state.page==="News"){
 h=pageHead("AROUND THE LEAGUE","NBA news","Latest headlines and stories from ESPN.");
 h+=btn("REFRESH HEADLINES","news");
 h+=state.news.length?state.news.map(n=>'<article class="card"><div class="eyebrow">ESPN / NBA</div><div class="story">'+esc(n.title)+'</div><p class="storydesc">'+esc(n.description||"")+'</p><a href="'+esc(n.link)+'" target="_blank" rel="noopener" style="color:var(--green);font-size:11px;font-weight:900;text-decoration:none">READ STORY ↗</a></article>').join(""):'<div class="empty">Refresh to load the latest headlines.</div>';
 }
 if(state.page==="Settings"){
 h=pageHead("PREFERENCES","Settings","Your API connections and local profile stay on this device.");
 h+='<label class="meta">PROFILE NAME</label><input class="input" id="profileName" value="'+esc(key("profile"))+'" placeholder="Your name"><label class="meta">BALLDONTLIE API KEY</label><input class="input" id="bdl" type="password" value="'+esc(key("bdl"))+'" placeholder="Paste API key"><label class="meta">THE ODDS API KEY</label><input class="input" id="oddskey" type="password" value="'+esc(key("odds"))+'" placeholder="Paste API key">'+btn("SAVE SETTINGS","save")+card("PRIVACY NOTE","Keys are stored in this browser's local storage. They are not sent to TipOFF servers. Avoid sharing this device profile.")+card("18+ ONLY","Gambling involves risk. Never stake money you cannot afford to lose.");
 }
 v.innerHTML=h;
}
function status(g){let s=g.status||"Scheduled";if(/^final/i.test(s))return"FINAL";if(s.includes(":")&&/[0-9]/.test(s))return"LIVE • "+s;return"UPCOMING"}
function gameCard(g){let a=g.visitor_team?.full_name||g.away_team||"Away",b=g.home_team?.full_name||g.home_team||"Home",st=status(g),sc=st==="FINAL"||st.startsWith("LIVE");return '<article class="card"><div class="row"><span class="meta">'+fmt(g.date||g.commence_time)+'</span><span class="eyebrow">'+st+'</span></div><div class="divider"></div><div class="row"><span class="team">'+esc(a)+'</span><strong class="score">'+(sc?esc(g.visitor_team_score):"AWAY")+'</strong></div><div class="row"><span class="team">'+esc(b)+'</span><strong class="score">'+(sc?esc(g.home_team_score):"HOME")+'</strong></div></article>'}
function oddsCard(e){let map={};(e.bookmakers||[]).forEach(b=>(b.markets||[]).filter(m=>m.key==="h2h").forEach(m=>(m.outcomes||[]).forEach(o=>{if(!map[o.name]||o.price>map[o.name].price)map[o.name]={price:o.price,book:b.title}})));return '<article class="card"><div class="team">'+esc(e.away_team)+' @ '+esc(e.home_team)+'</div><div class="meta" style="margin:5px 0 10px">TIP-OFF / '+fmt(e.commence_time)+'</div>'+Object.entries(map).map(([n,x])=>'<div class="row"><div><div class="team">'+esc(n)+'</div><div class="book">'+esc(x.book)+'</div></div><div class="price">'+Number(x.price).toFixed(2)+'</div></div><button class="btn secondary" data-add="'+esc(n)+'" data-price="'+x.price+'" data-event="'+esc(e.away_team+' @ '+e.home_team)+'">ADD TO SLIP</button><div class="divider"></div>').join("")+'</article>'}
async function api(url,headers={}){let r=await fetch(url,{headers});let t=await r.text();if(!r.ok)throw Error("HTTP "+r.status+" — "+t.slice(0,160));return JSON.parse(t)}
async function games(){if(!key("bdl")){state.page="Settings";render();toast("Add your BALLDONTLIE key first");return}try{toast("Loading fixtures…");let d=await api("https://api.balldontlie.io/v1/games?per_page=25",{Authorization:key("bdl")});state.games=d.data||[];render()}catch(e){toast("Games: "+e.message)}}
async function odds(){if(!key("odds")){state.page="Settings";render();toast("Add your Odds API key first");return}try{toast("Loading UK odds…");let d=await api("https://api.the-odds-api.com/v4/sports/basketball_nba/odds/?regions=uk&markets=h2h&oddsFormat=decimal&apiKey="+encodeURIComponent(key("odds")));state.events=d.filter(x=>new Date(x.commence_time)>new Date()).sort((a,b)=>new Date(a.commence_time)-new Date(b.commence_time));render()}catch(e){toast("Odds: "+e.message)}}
async function news(){try{toast("Loading NBA headlines…");let d=await api("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/news");state.news=(d.articles||[]).slice(0,20).map(x=>({title:x.headline,description:x.description,link:x.links?.web?.href||"#"}));render()}catch(e){toast("News could not load: "+e.message)}}
function act(a){if(a==="games")games();if(a==="odds")odds();if(a==="news")news();if(a==="search"){state.query=$("#search").value;render()}if(a==="save"){localStorage.setItem("tipoff_profile",$("#profileName").value.trim());localStorage.setItem("tipoff_bdl",$("#bdl").value.trim());localStorage.setItem("tipoff_odds",$("#oddskey").value.trim());toast("Settings saved on this device");render()}if(a==="addleg"){let name=$("#legname").value.trim(),o=Number($("#legodds").value);if(!name||!Number.isFinite(o)||o<=1){toast("Enter a selection and odds above 1.00");return}state.legs.push({name,odds:o});saveLegs();render()}if(a==="return"){let stake=Number($("#stake").value),total=state.legs.reduce((v,x)=>v*Number(x.odds),1);if(stake<=0||!Number.isFinite(stake)){toast("Enter a valid stake");return}$("#return").innerHTML='<div class="statgrid"><div class="stat"><span>TOTAL RETURN</span><strong>£'+(stake*total).toFixed(2)+'</strong></div><div class="stat"><span>POTENTIAL PROFIT</span><strong>£'+(stake*(total-1)).toFixed(2)+'</strong></div></div><p class="storydesc">Illustrative only. Odds can change and returns are not guaranteed.</p>'}}
function saveLegs(){localStorage.setItem("tipoff_legs",JSON.stringify(state.legs))}
document.addEventListener("click",e=>{let p=e.target.closest("[data-page]");if(p){state.page=p.dataset.page;render();return}let b=e.target.closest("[data-action]");if(b){act(b.dataset.action);return}let f=e.target.closest("[data-filter]");if(f){state.filter=f.dataset.filter;render();return}let rm=e.target.closest("[data-remove]");if(rm){state.legs.splice(Number(rm.dataset.remove),1);saveLegs();render();return}let add=e.target.closest("[data-add]");if(add){state.legs.push({name:add.dataset.event+" — "+add.dataset.add,odds:Number(add.dataset.price)});saveLegs();toast("Added to slip");return}});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b){state.page=b.dataset.page;render();if(state.page==="Games"&&!state.games.length)games();if(state.page==="Scanner"&&!state.events.length)odds();if(state.page==="News"&&!state.news.length)news()}});
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
